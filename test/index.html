<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9F3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ToDo試験">
  <title>デスクトップToDo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="installHint" class="install" hidden>
    <img src="icons/icon-192.png" alt="">
    <div>
      <b>ホーム画面に追加すると、アプリとして使えます</b>
      <p>Safariの <svg viewBox="0 0 24 24" aria-label="共有"><path d="M12 15V3m0 0L8 7m4-4 4 4M7 10H5v11h14V10h-2"/></svg>（共有）を押し、「ホーム画面に追加」を選んでください。共有ボタンが見えないときは、右下の「…」から開けます。</p>
    </div>
    <button class="icon" id="installClose" aria-label="閉じる">✕</button>
  </aside>
  <main id="login" class="login" hidden>
    <img src="icons/icon-192.png" alt="" class="login-icon">
    <h1>デスクトップToDo</h1>
    <p class="sub" id="loginLead">PCアプリと同じタスクを、スマホでも。</p>
    <form id="loginForm" class="card">
      <label>メールアドレス<input id="email" type="email" autocomplete="username" required></label>
      <label>パスワード<input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
      <p id="loginMessage" class="message" role="alert"></p>
      <button class="primary" id="loginButton">ログイン</button>
      <button type="button" class="link" id="modeButton">はじめて使う（アカウントを作る）</button>
      <button type="button" class="link" id="resetButton">パスワードを忘れた</button>
    </form>
  </main>

  <main id="app" class="app" hidden>
    <header class="top">
      <div>
        <h1>ToDo</h1>
        <p class="sub" id="countText"></p>
      </div>
      <span class="sync" id="syncText"></span>
      <button class="icon" id="settingsButton" aria-label="設定">
        <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4Z"/></svg>
      </button>
    </header>
    <p class="banner" id="tryOutBanner" hidden>お試しモード：データはこの端末の中だけに保存され、PCとは同期しません。</p>
    <nav class="tabs" id="tabs">
      <button data-filter="open">未完了</button>
      <button data-filter="done">完了</button>
      <button data-filter="all">すべて</button>
    </nav>
    <div class="chips" id="chips"></div>
    <div class="tools">
      <button class="small" id="sortButton"></button>
      <button class="small danger" id="clearDoneButton" hidden>完了したタスクを削除</button>
    </div>
    <ul class="list" id="list"></ul>
    <p class="empty" id="emptyText" hidden></p>
    <form class="addbar" id="addForm">
      <input id="addInput" placeholder="タスクを追加" enterkeyhint="done" maxlength="500" autocomplete="off">
      <button class="primary round" aria-label="追加">＋</button>
    </form>
  </main>

  <dialog id="taskSheet" class="sheet">
    <form method="dialog">
      <h2>タスクの詳細</h2>
      <label>タイトル<textarea id="editTitle" rows="2" maxlength="500"></textarea></label>
      <label>納期
        <span class="row"><input id="editDue" type="date"><button type="button" class="small" id="clearDue">なし</button></span>
      </label>
      <label>カテゴリ<select id="editCategory"></select></label>
      <p class="sub" id="editTime"></p>
      <div class="row end">
        <button type="button" class="small danger" id="deleteTask">削除</button>
        <span class="grow"></span>
        <button class="primary" value="save">閉じる</button>
      </div>
    </form>
  </dialog>

  <dialog id="settingsSheet" class="sheet">
    <form method="dialog">
      <h2>設定</h2>
      <p class="sub" id="accountText"></p>
      <h3>カテゴリ</h3>
      <ul class="cats" id="catList"></ul>
      <div class="row">
        <input id="catName" placeholder="新しいカテゴリ" maxlength="40">
        <button type="button" class="small" id="addCat">追加</button>
      </div>
      <p class="message" id="catMessage"></p>
      <div class="row end">
        <button type="button" class="small" id="signOutButton">ログアウト</button>
        <span class="grow"></span>
        <button class="primary" value="close">閉じる</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirmSheet" class="sheet">
    <form method="dialog">
      <p id="confirmText"></p>
      <div class="row end">
        <button value="no">やめる</button>
        <button class="primary danger-fill" value="yes" id="confirmYes">削除する</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
